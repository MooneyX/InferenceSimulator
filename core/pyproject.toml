[project]
name = "simcore"
version = "0.1.0"
description = "LLM serving discrete-event simulation kernel (zero IO)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simcore"]
