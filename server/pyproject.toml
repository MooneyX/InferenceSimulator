[project]
name = "simserver"
version = "0.1.0"
description = "HTTP service layer for the simcore simulation kernel"
requires-python = ">=3.12"
dependencies = [
    "simcore",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
simcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simserver"]
